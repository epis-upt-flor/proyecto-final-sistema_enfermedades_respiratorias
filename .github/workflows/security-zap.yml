name: security-zap-baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL objetivo para escanear (ej: https://api.respicare.dev)"
        required: true
        default: "http://localhost:3001"
  schedule:
    # Ejecutar semanalmente (lunes 2 AM UTC)
    - cron: '0 2 * * 1'
  push:
    branches:
      - master
    paths:
      - 'backend/src/**'
      - '.github/workflows/security-zap.yml'

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ github.event.inputs.target_url || 'http://localhost:3001' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 5 -I'
          fail_actions: true

      - name: Publicar reporte HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-html
          path: report_html.html
          retention-days: 30

      - name: Publicar reporte Markdown
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-md
          path: report_md.md
          retention-days: 30

      - name: Publicar reporte JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-json
          path: report_json.json
          retention-days: 30

      - name: Comentar en PR (si aplica)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('report_md.md')) {
              const report = fs.readFileSync('report_md.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 OWASP ZAP Security Scan\n\n${report}`
              });
            }


