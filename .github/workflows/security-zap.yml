name: security-zap-baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL objetivo para escanear (ej: https://api.respicare.dev)"
        required: true

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ github.event.inputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 5'
      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json


