name: Static Code Analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Ejecutar análisis completo cada domingo a las 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  backend-analysis:
    name: Backend Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true
      
      - name: Run TypeScript type check
        working-directory: ./backend
        run: npm run type-check
        continue-on-error: true
      
      - name: Run Prettier check
        working-directory: ./backend
        run: npm run format:check
        continue-on-error: true
      
      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-eslint-results
          path: backend/eslint-report.json
          if-no-files-found: ignore

  ai-services-analysis:
    name: AI Services Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-services/requirements*.txt
      
      - name: Install dependencies
        working-directory: ./ai-services
        run: |
          pip install -r requirements.txt
          pip install -r requirements-lint.txt
      
      - name: Run Pylint
        working-directory: ./ai-services
        run: |
          pylint --rcfile=.pylintrc --output-format=json api/ core/ services/ ml_models/ > pylint-report.json || true
        continue-on-error: true
      
      - name: Run Flake8
        working-directory: ./ai-services
        run: |
          flake8 --config=.flake8 api/ core/ services/ ml_models/ || true
        continue-on-error: true
      
      - name: Run Black check
        working-directory: ./ai-services
        run: |
          black --check api/ core/ services/ ml_models/ || true
        continue-on-error: true
      
      - name: Run mypy
        working-directory: ./ai-services
        run: |
          mypy api/ core/ services/ ml_models/ || true
        continue-on-error: true
      
      - name: Run Bandit security scan
        working-directory: ./ai-services
        run: |
          bandit -r api/ core/ services/ ml_models/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Run Safety check
        working-directory: ./ai-services
        run: |
          safety check --json --output safety-report.json || true
        continue-on-error: true
      
      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-services-analysis-reports
          path: |
            ai-services/pylint-report.json
            ai-services/bandit-report.json
            ai-services/safety-report.json
          if-no-files-found: ignore

  frontend-analysis:
    name: Frontend Web Static Analysis
    runs-on: ubuntu-latest
    if: false  # Deshabilitado hasta que se configure el frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./web
        run: npm run lint || true
        continue-on-error: true

  mobile-analysis:
    name: Mobile App Static Analysis
    runs-on: ubuntu-latest
    if: false  # Deshabilitado hasta que se configure mobile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./mobile
        run: npm run lint || true
        continue-on-error: true

  generate-report:
    name: Generate Analysis Report
    runs-on: ubuntu-latest
    needs: [backend-analysis, ai-services-analysis]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: analysis-reports
      
      - name: Generate summary
        run: |
          echo "## 📊 Static Code Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AI Services Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Pylint: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Flake8: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Safety: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 Ver reporte completo en: [docs/STATIC_CODE_ANALYSIS.md](docs/STATIC_CODE_ANALYSIS.md)" >> $GITHUB_STEP_SUMMARY

