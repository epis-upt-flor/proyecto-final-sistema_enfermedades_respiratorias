name: 'Setup Backend for Testing'
description: 'Inicia el backend con MongoDB y Redis para tests/escaneos'

inputs:
  backend_port:
    description: 'Puerto del backend'
    required: false
    default: '3001'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      shell: bash
      working-directory: ./backend
      run: npm ci
    
    - name: Build application
      shell: bash
      working-directory: ./backend
      run: npm run build
      continue-on-error: true
    
    - name: Start backend server
      shell: bash
      working-directory: ./backend
      run: |
        echo "🚀 Starting backend server on port ${{ inputs.backend_port }}..."
        npm start > backend.log 2>&1 &
        echo $! > backend.pid
        echo "Backend PID: $(cat backend.pid)"
      env:
        NODE_ENV: test
        PORT: ${{ inputs.backend_port }}
        MONGODB_URI: mongodb://localhost:27017/respicare-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-for-dast-scan-change-in-production
        JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-dast-scan-change-in-production
        SMTP_HOST: smtp.example.com
        SMTP_PORT: '587'
        SMTP_USER: test@example.com
        SMTP_PASS: test-password
        PUSH_PROVIDER: none
        AI_SERVICE_URL: http://localhost:8000
        LOG_LEVEL: info
    
    - name: Wait for backend to be ready
      shell: bash
      run: |
        echo "⏳ Waiting for backend to be ready..."
        timeout=60
        elapsed=0
        while ! curl -f http://localhost:${{ inputs.backend_port }}/api/v1/health > /dev/null 2>&1; do
          if [ $elapsed -ge $timeout ]; then
            echo "❌ Backend failed to start within $timeout seconds"
            echo "📋 Backend logs:"
            if [ -f backend/backend.log ]; then
              cat backend/backend.log
            fi
            exit 1
          fi
          echo "⏳ Waiting for backend to start... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed+2))
        done
        echo "✅ Backend is ready!"

