// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
  ext {
    kotlinVersion = '2.1.0'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

// Configuración global de Kotlin
ext {
  kotlinVersion = '2.1.0'
}

def projectRoot = rootDir.parentFile
def reactNativePackageJsonPath = providers.exec {
  workingDir(projectRoot)
  commandLine("node", "--print", "require.resolve('react-native/package.json')")
}.standardOutput.asText.get().trim()
def reactNativeDir = new File(reactNativePackageJsonPath).getParentFile()
def reactNativeAndroidDir = new File(reactNativeDir, "android")

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  
  // Configuración global para resolver conflictos de Android Support vs AndroidX
  configurations.all {
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-annotations'
    exclude group: 'com.android.support', module: 'support-v4'
    exclude group: 'com.android.support', module: 'support-core-utils'
    exclude group: 'com.android.support', module: 'support-fragment'
    
    resolutionStrategy {
      // Forzar uso de AndroidX
      force 'androidx.core:core:1.13.1'
      force 'androidx.core:core-ktx:1.13.1'
    }
  }
  
  // Configuración de Kotlin para todos los subproyectos
  afterEvaluate { project ->
    if (project.hasProperty('android')) {
      project.android {
        compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
    }
    if (project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
      project.android {
        kotlinOptions {
          jvmTarget = '17'
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
